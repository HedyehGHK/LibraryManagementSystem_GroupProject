<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Library Reports</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <script src="app.js" defer></script>
</head>

<body class="p-4">

<h1 class="mb-4">📊 Library Reports</h1>

<a href="index.html" class="btn btn-secondary mb-4">⬅ Back to Main Menu</a>



<!-- REPORT BUTTONS -->
<div class="card p-4 mb-4">
    <h3>Select a Report</h3>

    <div class="d-flex flex-wrap gap-3 mt-3">

        <button class="btn btn-primary" onclick="loadOverdue()">Overdue Books</button>
        <button class="btn btn-warning" onclick="loadOverdueWithFines()">Overdue + Fines</button>
        <button class="btn btn-danger" onclick="loadUnpaidFines()">Unpaid Fines</button>
        <button class="btn btn-info" onclick="loadTop5()">Top 5 Most Loaned</button>
        <button class="btn btn-success" onclick="loadMostBorrowed()">Most Borrowed</button>

    </div>

</div>



<!-- BOOK COPY STATUS REPORT -->
<div class="card p-4 mb-4">
    <h3>📚 Book Copy Status</h3>

    <div class="row g-3">

        <div class="col-md-4">
            <label class="form-label">Book ID</label>
            <input id="copy_status_id" type="number" class="form-control">
        </div>

        <div class="col-md-4">
            <button onclick="loadCopyStatus()" class="btn btn-success mt-4 w-100">Load Status</button>
        </div>

    </div>

</div>



<!-- PAY FINE -->
<div class="card p-4 mb-4">
    <h3>💵 Pay a Fine</h3>

    <div class="row g-3">

        <div class="col-md-4">
            <label class="form-label">Loan ID</label>
            <input id="fine_loan_id" type="number" class="form-control">
        </div>

        <div class="col-md-4">
            <button onclick="payFine()" class="btn btn-danger mt-4 w-100">Pay Fine</button>
        </div>

    </div>
</div>



<!-- RESULTS TABLE -->
<div class="card p-4">
    <h3>Results</h3>

    <table class="table table-striped mt-3">
        <thead id="reportHead"></thead>
        <tbody id="reportBody"></tbody>
    </table>
</div>

</body>
</html>
