<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Loan Management</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <script src="app.js" defer></script>
</head>

<body class="p-4">

<h1 class="mb-4">📦 Loan Management</h1>
<a href="index.html" class="btn btn-secondary mb-4">⬅ Back to Main Menu</a>

<!-- LOAN A BOOK -->
<div class="card p-4 mb-4">
    <h3>Loan a Book</h3>

    <form id="loanForm" class="row g-3">

        <div class="col-md-4">
            <label class="form-label">Copy ID</label>
            <input type="number" id="copy_id" class="form-control" required>
        </div>

        <div class="col-md-4">
            <label class="form-label">Member ID</label>
            <input type="number" id="loan_member_id" class="form-control" required>
        </div>

        <div class="col-md-4">
            <label class="form-label">Due Date (YYYY-MM-DD)</label>
            <input type="text" id="loan_due_date" class="form-control"
                   placeholder="Optional (auto 14 days)">
        </div>

        <div class="col-12">
            <button class="btn btn-success w-100">Loan Book</button>
        </div>

    </form>
</div>


<!-- RETURN A BOOK -->
<div class="card p-4 mb-4">
    <h3>Return a Book</h3>

    <form id="returnForm" class="row g-3">

        <div class="col-md-4">
            <label class="form-label">Loan ID</label>
            <input type="number" id="return_loan_id" class="form-control" required>
        </div>

        <div class="col-md-4">
            <label class="form-label">Return Date (YYYY-MM-DD)</label>
            <input type="text" id="return_date" class="form-control"
                   placeholder="Optional (uses SYSDATE)">
        </div>

        <div class="col-md-4">
            <button class="btn btn-warning w-100 mt-4">Return</button>
        </div>

    </form>
</div>


<!-- APPLY FINES -->
<div class="card p-4 mb-4">
    <h3>Apply Overdue Fines (Manual)</h3>

    <form id="fineForm" class="row g-3">

        <div class="col-md-6">
            <label class="form-label">Fine Per Day ($)</label>
            <input type="number" step="0.01" id="fine_per_day"
                   class="form-control" placeholder="Default: 0.50">
        </div>

        <div class="col-md-6">
            <button class="btn btn-danger w-100 mt-4">Apply Fines</button>
        </div>

    </form>
</div>


<!-- ALL LOANS TABLE -->
<div class="card p-4">
    <h3>All Loans</h3>

    <table class="table table-striped mt-3">
        <thead>
        <tr>
            <th>Loan ID</th>
            <th>Copy ID</th>
            <th>Member ID</th>
            <th>Loan Date</th>
            <th>Due Date</th>
        </tr>
        </thead>

        <tbody id="loanTableBody"></tbody>
    </table>
</div>


</body>
</html>
