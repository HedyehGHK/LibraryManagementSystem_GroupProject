<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Member Management</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <script src="app.js" defer></script>
</head>

<body class="p-4">

<h1 class="mb-4">👤 Member Management</h1>

<a href="index.html" class="btn btn-secondary mb-4">⬅ Back to Main Menu</a>


<!-- ADD MEMBER -->
<div class="card p-4 mb-4">
    <h3>Add New Member</h3>

    <form id="addMemberForm" class="row g-3">

        <div class="col-md-4">
            <label class="form-label">Full Name</label>
            <input type="text" id="m_name" class="form-control" required>
        </div>

        <div class="col-md-4">
            <label class="form-label">Member Type</label>
            <select id="m_type" class="form-control">
                <option value="Student">Student</option>
                <option value="Staff">Staff</option>
                <option value="Visitor">Visitor</option>
            </select>
        </div>

        <div class="col-md-4">
            <label class="form-label">Email</label>
            <input type="email" id="m_email" class="form-control">
        </div>

        <div class="col-12">
            <button class="btn btn-success w-100">Add Member</button>
        </div>

    </form>
</div>


<!-- UPDATE MEMBER -->
<div class="card p-4 mb-4">
    <h3>✏ Update Member (Full)</h3>

    <form id="updateMemberForm" class="row g-3">

        <div class="col-md-3">
            <label class="form-label">Member ID</label>
            <input type="number" id="u_id" class="form-control" required>
        </div>

        <div class="col-md-3">
            <label class="form-label">New Name</label>
            <input type="text" id="u_name" class="form-control">
        </div>

        <div class="col-md-3">
            <label class="form-label">New Type</label>
            <select id="u_type" class="form-control">
                <option value="">(No Change)</option>
                <option value="Student">Student</option>
                <option value="Staff">Staff</option>
                <option value="Visitor">Visitor</option>
            </select>
        </div>

        <div class="col-md-3">
            <label class="form-label">New Email</label>
            <input type="email" id="u_email" class="form-control">
        </div>

        <div class="col-12">
            <button class="btn btn-warning w-100">Update Member</button>
        </div>

    </form>
</div>


<!-- UPDATE EMAIL ONLY -->
<div class="card p-4 mb-4">
    <h3>✉ Update Email Only</h3>

    <form id="updateEmailForm" class="row g-3">

        <div class="col-md-6">
            <label class="form-label">Member ID</label>
            <input type="number" id="e_id" class="form-control" required>
        </div>

        <div class="col-md-6">
            <label class="form-label">New Email</label>
            <input type="email" id="e_email" class="form-control" required>
        </div>

        <div class="col-12">
            <button class="btn btn-info w-100">Update Email</button>
        </div>

    </form>
</div>


<!-- LOAN COUNT -->
<div class="card p-4 mb-4">
    <h3>📦 Loan Count</h3>

    <div class="row g-3">

        <div class="col-md-6">
            <label class="form-label">Member ID</label>
            <input type="number" id="lc_id" class="form-control">
        </div>

        <div class="col-md-6">
            <button class="btn btn-primary w-100 mt-4"
                    onclick="getLoanCount()">Check</button>
        </div>

        <div class="col-12 mt-3">
            <h5 id="loanCountOutput"></h5>
        </div>

    </div>
</div>


<!-- MEMBER LIST -->
<div class="card p-4">
    <h3>Registered Members</h3>

    <table class="table table-striped mt-3">
        <thead>
        <tr>
            <th>ID</th>
            <th>Full Name</th>
            <th>Type</th>
            <th>Join Date</th>
            <th>Email</th>
        </tr>
        </thead>

        <tbody id="memberTableBody"></tbody>
    </table>
</div>


</body>
</html>
