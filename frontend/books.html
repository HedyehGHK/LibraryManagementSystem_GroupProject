<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Management</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <script src="app.js" defer></script>
</head>

<body class="p-4">

<h1 class="mb-4">📚 Book Management</h1>
<a href="index.html" class="btn btn-secondary mb-4">⬅ Back to Main Menu</a>

<!-- SEARCH BOOKS -->
<div class="card p-4 mb-4">
    <h3>🔍 Search Books</h3>
    <div class="row g-3">

        <div class="col-md-6">
            <label class="form-label">Search by Title</label>
            <input type="text" id="searchTitle" class="form-control">
        </div>

        <div class="col-md-6">
            <label class="form-label">Search by Author</label>
            <input type="text" id="searchAuthor" class="form-control">
        </div>

        <div class="col-12">
            <button class="btn btn-primary w-100" onclick="searchBooks()">Search</button>
        </div>

    </div>
</div>

<!-- ADD BOOK -->
<div class="card p-4 mb-4">
    <h3>Add New Book</h3>
    <form id="addBookForm" class="row g-3">

        <div class="col-md-6">
            <label class="form-label">Title</label>
            <input type="text" id="title" class="form-control" required>
        </div>

        <div class="col-md-6">
            <label class="form-label">Author</label>
            <input type="text" id="author" class="form-control" required>
        </div>

        <div class="col-md-4">
            <label class="form-label">Publisher ID</label>
            <input type="number" id="publisher_id" class="form-control">
        </div>

        <div class="col-md-4">
            <label class="form-label">ISBN</label>
            <input type="text" id="isbn" class="form-control">
        </div>

        <div class="col-md-4">
            <label class="form-label">Publication Year</label>
            <input type="number" id="pub_year" class="form-control">
        </div>

        <div class="col-12">
            <button class="btn btn-success w-100">Add Book</button>
        </div>

    </form>
</div>

<!-- UPDATE BOOK -->
<div class="card p-4 mb-4">
    <h3>✏ Update Book</h3>

    <form id="updateBookForm" class="row g-3">

        <div class="col-md-3">
            <label class="form-label">Book ID</label>
            <input type="number" id="update_id" class="form-control" required>
        </div>

        <div class="col-md-3">
            <label class="form-label">New Title</label>
            <input type="text" id="update_title" class="form-control">
        </div>

        <div class="col-md-3">
            <label class="form-label">New Author</label>
            <input type="text" id="update_author" class="form-control">
        </div>

        <div class="col-md-3">
            <label class="form-label">New Pub Year</label>
            <input type="number" id="update_year" class="form-control">
        </div>

        <div class="col-12">
            <button class="btn btn-warning w-100">Update Book</button>
        </div>

    </form>
</div>

<!-- DELETE BOOK -->
<div class="card p-4 mb-4">
    <h3>❌ Delete Book</h3>
    <div class="row g-3">
        <div class="col-md-6">
            <label class="form-label">Book ID</label>
            <input type="number" id="delete_id" class="form-control">
        </div>

        <div class="col-md-6">
            <button class="btn btn-danger w-100 mt-4"
                    onclick="deleteBook()">Delete</button>
        </div>
    </div>
</div>

<!-- BOOK LIST -->
<div class="card p-4">
    <h3>All Books</h3>
    <table class="table table-striped mt-3">
        <thead>
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Author</th>
            <th>Publisher</th>
            <th>Total Copies</th>
            <th>Available</th>
            <th>Loaned</th>
            <th>Lost</th>
        </tr>
        </thead>
        <tbody id="booksTableBody"></tbody>
    </table>
</div>

</body>
</html>
